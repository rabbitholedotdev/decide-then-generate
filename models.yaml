# Per-task model routing. Critical path uses AsyncOpenAI directly (no LangChain).
tasks:
  decide:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 500
  generate:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.4
    max_tokens: 450
  judge:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 400
